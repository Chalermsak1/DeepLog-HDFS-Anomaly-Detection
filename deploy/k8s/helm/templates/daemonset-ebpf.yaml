{{- if .Values.ebpfProbe.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "deeplog.fullname" . }}-ebpf-probe
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplog.labels" . | nindent 4 }}
    app.kubernetes.io/component: ebpf-probe
spec:
  selector:
    matchLabels:
      {{- include "deeplog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ebpf-probe
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "deeplog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ebpf-probe
      annotations:
        container.apparmor.security.beta.kubernetes.io/ebpf-probe: unconfined
    spec:
      hostPID: {{ .Values.ebpfProbe.hostPID }}
      hostNetwork: {{ .Values.ebpfProbe.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "deeplog.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.ebpfProbe.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ebpf-probe
          image: "{{ .Values.ebpfProbe.image.repository }}:{{ .Values.ebpfProbe.image.tag }}"
          imagePullPolicy: {{ .Values.ebpfProbe.image.pullPolicy }}
          securityContext:
            privileged: {{ .Values.ebpfProbe.securityContext.privileged }}
            capabilities:
              {{- toYaml .Values.ebpfProbe.securityContext.capabilities | nindent 14 }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BPF_FS_PATH
              value: {{ .Values.ebpfProbe.bpfMountPath | quote }}
            - name: EBPF_RINGBUF_SIZE_MB
              value: {{ .Values.ebpfProbe.ringBufferSizeMb | quote }}
            - name: SAMPLING_RATE
              value: {{ .Values.ebpfProbe.samplingRate | quote }}
            - name: DROP_NORMAL_EVENTS
              value: {{ .Values.ebpfProbe.dropNormalEvents | quote }}
            - name: CONTROLLER_SERVICE
              value: {{ include "deeplog.fullname" . }}
          resources:
            {{- toYaml .Values.ebpfProbe.resources | nindent 12 }}
          volumeMounts:
            - name: bpf-fs
              mountPath: {{ .Values.ebpfProbe.bpfMountPath }}
              mountPropagation: Bidirectional
            - name: debugfs
              mountPath: /sys/kernel/debug
              mountPropagation: HostToContainer
            - name: kernel-modules
              mountPath: /lib/modules
              readOnly: true
            - name: kernel-src
              mountPath: /usr/src
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -e {{ .Values.ebpfProbe.bpfMountPath }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -e {{ .Values.ebpfProbe.bpfMountPath }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: bpf-fs
          hostPath:
            path: {{ .Values.ebpfProbe.bpfMountPath }}
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
        - name: kernel-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: kernel-src
          hostPath:
            path: /usr/src
            type: DirectoryOrCreate
{{- end }}
