version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # DeepLog Mission Control Cockpit (Web Dashboard, Inference & Multi-Modal Copilot)
  # ----------------------------------------------------------------------------
  deeplog-cockpit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: deeplog-cockpit:latest
    container_name: deeplog-cockpit
    restart: unless-stopped
    ports:
      - "8501:8501"   # Streamlit Mission Control Cockpit
      - "8000:8000"   # Prometheus Exporter & Telemetry Fusion API
    environment:
      - DEEPLOG_ENV=production
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=deeplog_analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - PROMETHEUS_METRICS_PORT=8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - deeplog_data:/app/data
      - deeplog_logs:/app/logs
    networks:
      - deeplog-net
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # Apache Kafka (KRaft Mode - Event Stream Ingestion & eBPF Telemetry Ingestion)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: deeplog-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 1000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - deeplog-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # ClickHouse Columnar Database (Real-time Analytics Sink for Log Events & Vectors)
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: deeplog-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP Interface
      - "9000:9000"   # Native TCP Interface
    environment:
      CLICKHOUSE_DB: deeplog_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - deeplog-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Prometheus Time-Series Metrics Exporter & Monitoring Engine
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: deeplog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus_data:/prometheus
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - deeplog-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ------------------------------------------------------------------------------
# High-Performance Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  deeplog-net:
    name: deeplog-net
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  deeplog_data:
    name: deeplog_data
  deeplog_logs:
    name: deeplog_logs
  kafka_data:
    name: kafka_data
  clickhouse_data:
    name: clickhouse_data
  clickhouse_logs:
    name: clickhouse_logs
  prometheus_data:
    name: prometheus_data
